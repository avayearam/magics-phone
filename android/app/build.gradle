plugins {
    id 'com.android.application'
}

android {
    namespace 'site.magics.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'site.magics.phone'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
